# Resolume Twitch OSC Bridge Configuration

websocket:
  url: "wss://twitch-api.waterhousestudios.nl/ws"

osc:
  host: "127.0.0.1"
  port: 7000

# Event mappings: event type -> OSC actions
# Each mapping has a list of actions:
#   - layer/clip: Resolume layer and clip to trigger
#   - template: Text template with {field} placeholders (optional)
#
# If template is omitted, the clip is triggered without setting text.
mappings:
  follow:
    actions:
      - layer: 1
        clip: 1
        template: "{user_name}\nFollowed!"
      - layer: 2
        clip: 1

  subscribe:
    actions:
      - layer: 1
        clip: 1
        template: "{user_name}\nSubscribed!"

  gift_sub:
    actions:
      - layer: 1
        clip: 1
        template: "{user_name}\nGifted {total} Subs!"

  cheer:
    actions:
      - layer: 1
        clip: 1
        template: "{user_name}\nGave {bits} Bits!"

  raid:
    actions:
      - layer: 1
        clip: 1
        template: "{from_broadcaster_user_name}\nRaided with {viewers}!"

  chat:
    actions:
      - layer: 1
        clip: 2
        template: "{chatter_user_name}: {message_text}"

  stream_start:
    actions:
      - layer: 1
        clip: 1
        template: "Stream is LIVE!"

  stream_end:
    actions:
      - layer: 1
        clip: 1
        template: "Stream ended. Thanks for watching!"
