# Resolume Twitch OSC Bridge Configuration

websocket:
  url: "wss://twitch-api.waterhousestudios.nl/ws"

osc:
  host: "127.0.0.1"
  port: 7000

# Default settings for event mappings
defaults:
  debounce: "8s" # Time before clips are disconnected/cleared

# Event mappings: event type -> OSC actions
#
# Each mapping supports:
#   actions:         List of clips to trigger
#     - layer/clip:  Resolume layer and clip number
#     - template:    Text template with {field} placeholders (optional)
#   debounce:        Override default debounce duration (optional, e.g. "15s")
#   return_to_scene: Set to false to disable auto-disconnect (default: true)
mappings:
  follow:
    actions:
      - layer: 1
        clip: 1
        template: "{user_name}\nFollowed!"
      - layer: 2
        clip: 1

  subscribe:
    actions:
      - layer: 1
        clip: 1
        template: "{user_name}\nSubscribed!"

  gift_sub:
    actions:
      - layer: 1
        clip: 1
        template: "{user_name}\nGifted {total} Subs!"

  cheer:
    actions:
      - layer: 1
        clip: 1
        template: "{user_name}\nGave {bits} Bits!"

  raid:
    debounce: "15s" # Raids stay visible longer
    actions:
      - layer: 1
        clip: 1
        template: "{from_broadcaster_user_name}\nRaided with {viewers}!"

  chat:
    return_to_scene: false # Chat stays visible until next message
    actions:
      - layer: 1
        clip: 2
        template: "{chatter_user_name}:\n{message_text}"

  stream_start:
    actions:
      - layer: 1
        clip: 1
        template: "Stream is LIVE!"

  stream_end:
    actions:
      - layer: 1
        clip: 1
        template: "Stream ended. Thanks for watching!"
